<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Từ điển HTML • CSS • JS</title>
<style>
  :root{
    --bg:#f4f6fb;--panel:#ffffff;--panel2:#f8fafc;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;
    --primary:#4f46e5;--primary-soft:#eef2ff;--ok:#16a34a;
    --html:#e34c26;--css:#2965f1;--js:#d99a00;
    --code-bg:#0b1020;--code-text:#e6edf7;--shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06);
    --side:290px;
  }
  :root[data-theme="dark"]{
    --bg:#0b1020;--panel:#121935;--panel2:#0f1530;--text:#e6edf7;--muted:#94a3b8;--border:#222c4f;
    --primary:#818cf8;--primary-soft:#1b2250;--code-bg:#070b18;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    --html:#ff7a52;--css:#6c9bff;--js:#fbbf24;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;scroll-padding-top:84px}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;transition:background .2s,color .2s}
  button{font-family:inherit}

  /* ===== TOPBAR ===== */
  .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:12px 20px;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;white-space:nowrap}
  .logo i{font-style:normal;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;color:#fff;font-size:15px;background:linear-gradient(135deg,#4f46e5,#9333ea)}
  .search{flex:1;position:relative;max-width:640px;margin:0 auto}
  .search input{width:100%;padding:10px 14px 10px 40px;border:1px solid var(--border);border-radius:12px;background:var(--panel2);color:var(--text);font-size:15px;outline:none}
  .search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 20%,transparent)}
  .search span{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.6}
  .icon-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);width:40px;height:40px;border-radius:10px;cursor:pointer;font-size:17px;flex:none}
  .icon-btn:hover{background:var(--primary-soft)}
  #menuBtn{display:none}

  /* ===== LAYOUT ===== */
  .layout{display:grid;grid-template-columns:var(--side) 1fr;max-width:1500px;margin:0 auto}
  aside{position:sticky;top:65px;align-self:start;height:calc(100vh - 65px);overflow-y:auto;padding:18px 14px 30px;border-right:1px solid var(--border)}
  aside::-webkit-scrollbar{width:6px}aside::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
  .side-title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 8px 6px;cursor:pointer}
  .side-title b{width:10px;height:10px;border-radius:3px;display:inline-block}
  .navitem{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;color:var(--text);padding:8px 10px;border-radius:9px;cursor:pointer;font-size:14px}
  .navitem:hover{background:var(--primary-soft)}
  .navitem.active{background:var(--primary);color:#fff}
  .navitem em{font-style:normal;font-size:12px;opacity:.75;background:color-mix(in srgb,var(--muted) 16%,transparent);padding:1px 8px;border-radius:99px}
  .navitem.active em{background:rgba(255,255,255,.25);opacity:1}
  main{padding:24px 28px 60px;min-width:0}

  /* ===== HERO ===== */
  .hero{border-radius:20px;padding:28px;color:#fff;background:linear-gradient(135deg,#4338ca 0%,#7c3aed 55%,#db2777 100%);box-shadow:var(--shadow);position:relative;overflow:hidden}
  .hero::after{content:"</>";position:absolute;right:20px;bottom:-26px;font:800 120px/1 Consolas,monospace;opacity:.12}
  .hero h1{font-size:28px;line-height:1.25;margin-bottom:6px}
  .hero p{opacity:.92;max-width:620px}
  .stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .stat{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);padding:8px 16px;border-radius:12px;min-width:92px}
  .stat b{display:block;font-size:22px;line-height:1.1}
  .stat span{font-size:12px;opacity:.9}

  /* ===== TOOLBAR ===== */
  .tools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:22px 0 6px}
  .tabs{display:inline-flex;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:4px}
  .tab{border:0;background:transparent;color:var(--muted);padding:8px 16px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px}
  .tab.active{background:var(--primary);color:#fff}
  .count{color:var(--muted);font-size:14px}

  /* ===== SECTION TITLES ===== */
  .sec{display:flex;align-items:center;gap:10px;margin:30px 0 12px}
  .sec h2{font-size:19px}
  .sec .line{flex:1;height:1px;background:var(--border)}
  .pill{font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;color:#fff;white-space:nowrap}
  .pill.HTML{background:var(--html)}.pill.CSS{background:var(--css)}.pill.JavaScript{background:var(--js);color:#1a1300}

  /* ===== OVERVIEW TABLE ===== */
  .otable{background:var(--panel);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
  .orow{display:grid;grid-template-columns:200px 1.1fr 1.5fr 92px;gap:14px;align-items:start;padding:12px 18px;border-top:1px solid var(--border);font-size:14px}
  .orow:first-child{border-top:0}
  .orow.head{background:var(--panel2);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .orow:not(.head):hover{background:var(--primary-soft)}
  .otag{font-family:Consolas,Menlo,monospace;font-weight:700;color:#be185d;word-break:break-word}
  :root[data-theme="dark"] .otag{color:#f9a8d4}
  .odesc{font-weight:600}
  .ofunc{color:var(--muted)}
  .go{justify-self:end;border:1px solid var(--primary);color:var(--primary);background:transparent;border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
  .go:hover{background:var(--primary);color:#fff}

  /* ===== CARDS ===== */
  .grid{display:grid;gap:16px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;border-top:4px solid var(--c,var(--primary));transition:transform .15s,box-shadow .15s}
  .card.HTML{--c:var(--html)}.card.CSS{--c:var(--css)}.card.JavaScript{--c:var(--js)}
  .card.flash{animation:flash 1.4s ease}
  @keyframes flash{0%,100%{box-shadow:var(--shadow)}30%{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 45%,transparent)}}
  .chead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 18px 6px}
  .tagname{font-family:Consolas,Menlo,monospace;font-size:19px;font-weight:700;color:#be185d;background:#fdf2f8;padding:3px 12px;border-radius:8px;word-break:break-word}
  :root[data-theme="dark"] .tagname{background:#3a1030;color:#f9a8d4}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  .b{border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:6px 12px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600}
  .b:hover{border-color:var(--primary);color:var(--primary)}
  .b.done{background:var(--ok);border-color:var(--ok);color:#fff}
  .b.run{background:var(--ok);border-color:var(--ok);color:#fff}
  .b.run:hover{filter:brightness(.92);color:#fff}
  .info{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:8px 18px 4px}
  .box{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-size:14px}
  .box small{display:block;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--primary);margin-bottom:2px}
  .code{margin:12px 18px 0;border-radius:12px;overflow:hidden;background:var(--code-bg)}
  .code-top{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;font-size:12px;color:#94a3b8;border-bottom:1px solid #1e2a4a}
  .code pre{padding:12px 14px;overflow-x:auto;font:13.5px/1.55 Consolas,Menlo,monospace;color:var(--code-text)}
  .note{font-size:12px;color:var(--muted);padding:8px 18px 16px}
  .empty{text-align:center;color:var(--muted);padding:60px 0;font-size:18px}

  /* ===== TOAST ===== */
  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#0f172a;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:200}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ===== MODAL RUN ===== */
  .modal{position:fixed;inset:0;background:rgba(5,8,20,.7);backdrop-filter:blur(3px);z-index:100;display:none;padding:10px}
  .modal.open{display:flex}
  .mbox{background:var(--panel);margin:auto;width:100%;max-width:1300px;height:100%;max-height:96vh;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border)}
  .mhead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .mhead h3{font-size:15px;font-family:Consolas,Menlo,monospace}
  .mbody{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
  .pane{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--border)}
  .plabel{font-size:12px;font-weight:700;color:var(--muted);padding:5px 12px;background:var(--panel2);border-bottom:1px solid var(--border)}
  #editor{flex:1;width:100%;border:0;padding:12px;font:13px/1.55 Consolas,Menlo,monospace;resize:none;outline:none;background:var(--code-bg);color:var(--code-text);tab-size:2;white-space:pre}
  #preview{flex:1;width:100%;border:0;background:#fff;min-height:0}
  #con{height:96px;overflow:auto;background:#05070f;color:#86efac;font:12px/1.45 Consolas,monospace;padding:6px 12px;white-space:pre-wrap}
  #con .err{color:#fca5a5}

  /* ===== RESPONSIVE ===== */
  .scrim{display:none}
  @media(max-width:980px){
    .layout{grid-template-columns:1fr}
    aside{position:fixed;left:0;top:0;bottom:0;height:100%;width:290px;background:var(--panel);z-index:90;transform:translateX(-100%);transition:transform .25s;padding-top:70px}
    body.menu aside{transform:none}
    body.menu .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:80}
    #menuBtn{display:block}
    main{padding:16px}
    .info{grid-template-columns:1fr}
  }
  @media(max-width:760px){
    .logo span{display:none}
    .orow{grid-template-columns:1fr;gap:4px}
    .orow.head{display:none}
    .go{justify-self:start;margin-top:4px}
    .mbody{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
    .hero h1{font-size:22px}
  }
</style>
</head>
<body>

<div class="topbar">
  <button class="icon-btn" id="menuBtn" aria-label="Mở menu">☰</button>
  <div class="logo"><i>&lt;/&gt;</i><span>Từ điển Web</span></div>
  <div class="search"><span>🔍</span><input id="search" type="search" placeholder="Tìm phần tử/lệnh: img, form, flex, grid, click, fetch..."></div>
  <button class="icon-btn" id="themeBtn" aria-label="Đổi giao diện sáng/tối">🌙</button>
</div>

<div class="layout">
  <aside id="side"></aside>
  <main>
    <section class="hero">
      <h1>Tra cứu HTML • CSS • JavaScript</h1>
      <p>Mỗi phần tử có công dụng, chức năng, tính năng và ví dụ. Copy trọn file HTML hoặc bấm “Chạy thử” để sửa và xem kết quả ngay.</p><br><p style="text-align: center;">Creator Văn Đức 💫</p>
      <div class="stats" id="stats"></div>
    </section>

    <div class="tools">
      <div class="tabs">
        <button class="tab active" data-view="overview">📋 Bảng tổng quan</button>
        <button class="tab" data-view="cards">🧩 Chi tiết &amp; ví dụ</button>
      </div>
      <div class="count" id="count"></div>
    </div>

    <div id="list"></div>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast"></div>

<div class="modal" id="modal">
  <div class="mbox">
    <div class="mhead">
      <h3 id="mtitle">Chạy thử</h3>
      <div class="btns">
        <button class="b run" id="mrun">▶ Chạy lại</button>
        <button class="b" id="mcopy">📋 Copy code</button>
        <button class="b" id="mclose">✕ Đóng</button>
      </div>
    </div>
    <div class="mbody">
      <div class="pane">
        <div class="plabel">Code (sửa tùy ý, kết quả tự cập nhật)</div>
        <textarea id="editor" spellcheck="false"></textarea>
      </div>
      <div class="pane">
        <div class="plabel">Kết quả</div>
        <iframe id="preview" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>
        <div class="plabel">Console (console.log và lỗi JS)</div>
        <div id="con"></div>
      </div>
    </div>
  </div>
</div>

<script>
// [tên, nhóm, công dụng, chức năng, tính năng, thẻ mẫu để copy, ví dụ]
const T = [
// ===== CẤU TRÚC =====
['!DOCTYPE','Cấu trúc trang','Khai báo loại tài liệu','Báo cho trình duyệt biết đây là HTML5','Phải đặt dòng đầu tiên, không cần thẻ đóng','<!DOCTYPE html>','<!DOCTYPE html>\n<html lang="vi">\n  ...\n</html>'],
['html','Cấu trúc trang','Phần tử gốc','Bao toàn bộ nội dung trang','Thuộc tính lang giúp trình duyệt/công cụ đọc đúng ngôn ngữ','<html lang="vi">\n</html>','<html lang="vi">\n  <head>...</head>\n  <body>...</body>\n</html>'],
['head','Cấu trúc trang','Vùng thông tin trang','Chứa metadata, tiêu đề, CSS, script','Nội dung không hiển thị trực tiếp trên trang','<head>\n</head>','<head>\n  <meta charset="UTF-8">\n  <title>Trang của tôi</title>\n</head>'],
['body','Cấu trúc trang','Phần thân trang','Chứa mọi nội dung hiển thị cho người dùng','Mỗi trang chỉ có 1 body','<body>\n</body>','<body>\n  <h1>Xin chào</h1>\n</body>'],

// ===== METADATA =====
['title','Metadata (head)','Tiêu đề trang','Hiện trên tab trình duyệt, kết quả Google','Quan trọng cho SEO, mỗi trang chỉ 1 title','<title></title>','<title>Học HTML cơ bản</title>'],
['meta','Metadata (head)','Thông tin mô tả trang','Khai báo charset, viewport, mô tả SEO, tác giả','Thẻ rỗng (không có thẻ đóng)','<meta name="description" content="">','<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<meta name="description" content="Website học lập trình">'],
['link','Metadata (head)','Liên kết tài nguyên ngoài','Nhúng file CSS, favicon, font','rel="stylesheet" để nạp CSS','<link rel="stylesheet" href="style.css">','<link rel="stylesheet" href="style.css">\n<link rel="icon" href="favicon.ico">'],
['style','Metadata (head)','Viết CSS trực tiếp','Định kiểu giao diện ngay trong file HTML','Phù hợp CSS ngắn, thử nghiệm','<style>\n</style>','<style>\n  body { background: #f0f0f0; }\n  h1 { color: blue; }\n</style>'],
['base','Metadata (head)','Đường dẫn gốc','Đặt URL cơ sở cho mọi link tương đối','Chỉ 1 thẻ base trong trang','<base href="https://example.com/">','<base href="https://example.com/" target="_blank">'],

// ===== BỐ CỤC NGỮ NGHĨA =====
['header','Bố cục ngữ nghĩa','Phần đầu trang/khu vực','Chứa logo, tiêu đề, menu giới thiệu','Tốt cho SEO và trình đọc màn hình','<header>\n</header>','<header>\n  <h1>Website của tôi</h1>\n</header>'],
['nav','Bố cục ngữ nghĩa','Khu vực điều hướng','Chứa menu liên kết chính','Giúp trình duyệt/công cụ hỗ trợ nhận biết menu','<nav>\n</nav>','<nav>\n  <a href="/">Trang chủ</a>\n  <a href="/gioi-thieu">Giới thiệu</a>\n</nav>'],
['main','Bố cục ngữ nghĩa','Nội dung chính','Bao nội dung chính, độc nhất của trang','Chỉ dùng 1 lần trong mỗi trang','<main>\n</main>','<main>\n  <h2>Bài viết mới</h2>\n</main>'],
['section','Bố cục ngữ nghĩa','Một khu vực/chương nội dung','Nhóm nội dung cùng chủ đề','Thường kèm một tiêu đề h2–h6','<section>\n</section>','<section>\n  <h2>Dịch vụ</h2>\n  <p>Mô tả dịch vụ...</p>\n</section>'],
['article','Bố cục ngữ nghĩa','Nội dung độc lập','Bài viết, tin tức, bình luận có thể tách riêng','Có ý nghĩa khi đứng riêng','<article>\n</article>','<article>\n  <h2>Tiêu đề bài viết</h2>\n  <p>Nội dung...</p>\n</article>'],
['aside','Bố cục ngữ nghĩa','Nội dung phụ','Thanh bên, quảng cáo, ghi chú liên quan','Nội dung liên quan nhưng không thuộc luồng chính','<aside>\n</aside>','<aside>\n  <h3>Bài viết liên quan</h3>\n</aside>'],
['footer','Bố cục ngữ nghĩa','Chân trang/khu vực','Bản quyền, liên hệ, liên kết phụ','Dùng cho cả trang hoặc từng section','<footer>\n</footer>','<footer>\n  <p>&copy; 2026 Website của tôi</p>\n</footer>'],
['div','Bố cục ngữ nghĩa','Khối chứa chung','Chia khối để bố cục, gắn CSS/JS','Là thẻ block, không mang ý nghĩa ngữ nghĩa','<div class="">\n</div>','<div class="box">\n  <p>Nội dung trong khối</p>\n</div>'],
['span','Bố cục ngữ nghĩa','Vùng chứa trong dòng','Bọc một đoạn chữ để tô màu/định kiểu','Là thẻ inline, không xuống dòng','<span class=""></span>','<p>Giá: <span class="price">99.000đ</span></p>'],

// ===== VĂN BẢN =====
['h1 – h6','Văn bản','Tiêu đề các cấp','Tạo tiêu đề; h1 lớn nhất, h6 nhỏ nhất','Nên dùng 1 h1/trang, chia cấp theo thứ tự','<h1></h1>','<h1>Tiêu đề chính</h1>\n<h2>Mục lớn</h2>\n<h3>Mục nhỏ</h3>'],
['p','Văn bản','Đoạn văn','Chứa một đoạn văn bản','Tự xuống dòng và có khoảng cách trên/dưới','<p></p>','<p>Đây là một đoạn văn.</p>'],
['br','Văn bản','Xuống dòng','Ngắt dòng ngay tại vị trí đặt','Thẻ rỗng, không có thẻ đóng','<br>','Dòng 1<br>Dòng 2'],
['hr','Văn bản','Đường kẻ ngang','Ngăn cách các phần nội dung','Thẻ rỗng, thể hiện sự chuyển chủ đề','<hr>','<p>Phần 1</p>\n<hr>\n<p>Phần 2</p>'],
['pre','Văn bản','Văn bản định dạng sẵn','Giữ nguyên khoảng trắng và xuống dòng','Thường dùng để hiển thị code','<pre>\n</pre>','<pre>\nDòng 1\n    Dòng 2 thụt vào\n</pre>'],

const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const groupOf = c => c.startsWith('CSS') ? 'CSS' : c.startsWith('JavaScript') ? 'JavaScript' : 'HTML';
const isCode = c => groupOf(c) !== 'HTML';
const groups = ['HTML','CSS','JavaScript'];
const groupColor = {HTML:'var(--html)',CSS:'var(--css)',JavaScript:'var(--js)'};
const catOrder = [...new Set(T.map(t => t[1]))];
const state = {cat:'all', group:'all', view:'overview', q:''};

function label(t){
  const name = t[0];
  if(isCode(t[1])) return name;
  return name.startsWith('!') ? '<'+name+'>' : '<'+name.split(' ')[0]+'>';
}

/* ---------- toast + copy ---------- */
let toastT;
function toast(msg){
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove('show'), 1600);
}
function copyText(text, btn){
  const done = () => {
    toast('✓ Đã copy vào clipboard');
    if(btn){ const old = btn.textContent; btn.textContent = '✓ Đã copy'; btn.classList.add('done');
      setTimeout(()=>{btn.textContent = old; btn.classList.remove('done');},1200); }
  };
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
    ta.select(); try{document.execCommand('copy');}catch(e){} ta.remove(); done();
  };
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done).catch(fallback);
  else fallback();
}

/* ---------- ghép ví dụ thành trang HTML đầy đủ ---------- */
function fullDoc(t){
  const name = t[0], cat = t[1], ex = t[6];
  const ind = s => name === 'pre' ? s : s.split('\n').map(l => l ? '  ' + l : l).join('\n');
  const meta = '  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n';
  const head = '<head>\n' + meta + '  <title>Demo</title>\n</head>';
  if(/^\s*<!DOCTYPE/i.test(ex)) return ex;
  if(/^\s*<html/i.test(ex)) return '<!DOCTYPE html>\n' + ex;
  if(name === 'head') return '<!DOCTYPE html>\n<html lang="vi">\n' + ex + '\n<body>\n  <p>Nội dung trang demo</p>\n</body>\n</html>';
  if(name === 'body') return '<!DOCTYPE html>\n<html lang="vi">\n' + head + '\n' + ex + '\n</html>';
  if(cat === 'Metadata (head)'){
    const m = ex.includes('charset') ? '' : '  <meta charset="UTF-8">\n';
    const ti = name === 'title' ? '' : '  <title>Demo</title>\n';
    return '<!DOCTYPE html>\n<html lang="vi">\n<head>\n' + m + ti + ind(ex) + '\n</head>\n<body>\n  <p>Nội dung trang demo</p>\n</body>\n</html>';
  }
  return '<!DOCTYPE html>\n<html lang="vi">\n' + head + '\n<body>\n' + ind(ex) + '\n</body>\n</html>';
}

/* ---------- chạy thử ---------- */
const hook = '<script>(function(){function s(t,a){try{parent.postMessage({__con:1,t:t,m:Array.prototype.map.call(a,function(x){try{return typeof x==="object"?JSON.stringify(x):String(x)}catch(e){return String(x)}}).join(" ")},"*")}catch(e){}}["log","warn","error","info"].forEach(function(k){var o=console[k];console[k]=function(){s(k,arguments);o.apply(console,arguments)}});window.addEventListener("error",function(e){s("error",[e.message])})})();<\/script>';
function injectHook(doc){
  if(/<head[^>]*>/i.test(doc)) return doc.replace(/<head[^>]*>/i, m => m + hook);
  if(/<html[^>]*>/i.test(doc)) return doc.replace(/<html[^>]*>/i, m => m + hook);
  return hook + doc;
}
function run(){ $('con').textContent = ''; $('preview').srcdoc = injectHook($('editor').value); }
function openRun(t){
  $('mtitle').textContent = 'Chạy thử: ' + label(t);
  $('editor').value = fullDoc(t);
  $('modal').classList.add('open'); document.body.style.overflow = 'hidden'; run();
}
function closeRun(){ $('modal').classList.remove('open'); document.body.style.overflow = ''; $('preview').srcdoc = ''; }
let runTimer;
$('editor').addEventListener('input', () => { clearTimeout(runTimer); runTimer = setTimeout(run, 500); });
$('mrun').onclick = run;
$('mclose').onclick = closeRun;
$('mcopy').onclick = e => copyText($('editor').value, e.target);
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeRun(); });
window.addEventListener('message', e => {
  const d = e.data;
  if(!d || !d.__con || e.source !== $('preview').contentWindow) return;
  const line = document.createElement('div');
  if(d.t === 'error') line.className = 'err';
  line.textContent = (d.t === 'error' ? '✖ ' : d.t === 'warn' ? '⚠ ' : '› ') + d.m;
  $('con').appendChild(line); $('con').scrollTop = $('con').scrollHeight;
});

/* ---------- lọc ---------- */
function filtered(){
  const q = state.q.toLowerCase();
  return T.map((t,i)=>({t,i})).filter(({t}) =>
    (state.cat === 'all' || t[1] === state.cat) &&
    (state.group === 'all' || groupOf(t[1]) === state.group) &&
    (!q || t.join(' ').toLowerCase().includes(q)));
}

/* ---------- sidebar ---------- */
function buildSide(){
  const side = $('side'); side.innerHTML = '';
  const mk = (text, count, cat, group) => {
    const b = document.createElement('button');
    b.className = 'navitem' + ((state.cat === cat && state.group === group) ? ' active' : '');
    b.innerHTML = `<span>${esc(text)}</span><em>${count}</em>`;
    b.onclick = () => { state.cat = cat; state.group = group; document.body.classList.remove('menu'); buildSide(); render(); window.scrollTo({top:0}); };
    side.appendChild(b);
  };
  mk('Tất cả', T.length, 'all', 'all');
  groups.forEach(g => {
    const t = document.createElement('div'); t.className = 'side-title';
    t.innerHTML = `<b style="background:${groupColor[g]}"></b>${g === 'HTML' ? 'Thẻ HTML' : g}`;
    t.onclick = () => { state.cat = 'all'; state.group = g; document.body.classList.remove('menu'); buildSide(); render(); };
    side.appendChild(t);
    catOrder.filter(c => groupOf(c) === g).forEach(c => mk(c.replace(/^(CSS|JavaScript) – /,''), T.filter(x => x[1] === c).length, c, g));
  });
}

/* ---------- render ---------- */
function sectionHead(cat, n){
  const g = groupOf(cat);
  return `<div class="sec"><span class="pill ${g}">${g}</span><h2>${esc(cat.replace(/^(CSS|JavaScript) – /,''))}</h2><span class="count">${n} mục</span><div class="line"></div></div>`;
}

function render(){
  const items = filtered(); const list = $('list'); list.innerHTML = '';
  $('count').textContent = `Hiển thị ${items.length} / ${T.length} mục`;
  if(!items.length){ list.innerHTML = '<div class="empty">Không tìm thấy kết quả phù hợp 😢</div>'; return; }

  catOrder.forEach(cat => {
    const rows = items.filter(x => x.t[1] === cat);
    if(!rows.length) return;
    list.insertAdjacentHTML('beforeend', sectionHead(cat, rows.length));

    if(state.view === 'overview'){
      const tbl = document.createElement('div'); tbl.className = 'otable';
      tbl.innerHTML = '<div class="orow head"><div>Phần tử</div><div>Công dụng</div><div>Chức năng</div><div></div></div>';
      rows.forEach(({t,i}) => {
        const r = document.createElement('div'); r.className = 'orow';
        r.innerHTML = `<div class="otag">${esc(label(t))}</div><div class="odesc">${esc(t[2])}</div><div class="ofunc">${esc(t[3])}</div><button class="go">Xem ví dụ →</button>`;
        r.querySelector('.go').onclick = () => gotoCard(i);
        tbl.appendChild(r);
      });
      list.appendChild(tbl);
    } else {
      const grid = document.createElement('div'); grid.className = 'grid';
      rows.forEach(({t,i}) => grid.appendChild(card(t,i)));
      list.appendChild(grid);
    }
  });
}

function card(t,i){
  const [,cat,desc,func,feat,snippet,example] = t; const g = groupOf(cat);
  const el = document.createElement('div'); el.className = 'card ' + g; el.id = 'e-' + i;
  el.innerHTML = `
    <div class="chead">
      <span class="tagname">${esc(label(t))}</span>
      <div class="btns">
        <button class="b" data-k="s">📋 ${isCode(cat) ? 'Copy lệnh' : 'Copy thẻ'}</button>
        <button class="b" data-k="e">📄 Copy ví dụ (full HTML)</button>
        <button class="b run" data-k="r">▶ Chạy thử</button>
      </div>
    </div>
    <div class="info">
      <div class="box"><small>Công dụng</small>${esc(desc)}</div>
      <div class="box"><small>Chức năng</small>${esc(func)}</div>
      <div class="box"><small>Tính năng</small>${esc(feat)}</div>
    </div>
    <div class="code"><div class="code-top"><span>Ví dụ</span><span>${g}</span></div><pre>${esc(example)}</pre></div>
    <div class="note">“Copy ví dụ” copy trọn trang từ &lt;!DOCTYPE html&gt; đến &lt;/html&gt;, dán vào file .html là chạy được.</div>`;
  el.querySelector('[data-k="s"]').onclick = e => copyText(snippet, e.target);
  el.querySelector('[data-k="e"]').onclick = e => copyText(fullDoc(t), e.target);
  el.querySelector('[data-k="r"]').onclick = () => openRun(t);
  return el;
}

function setView(v){
  state.view = v;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  render();
}
function gotoCard(i){
  setView('cards');
  const el = document.getElementById('e-' + i);
  if(el){ el.scrollIntoView({behavior:'smooth', block:'center'}); el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),1500); }
}

/* ---------- khởi tạo ---------- */
document.querySelectorAll('.tab').forEach(b => b.onclick = () => setView(b.dataset.view));
$('search').addEventListener('input', e => { state.q = e.target.value.trim(); render(); });
$('menuBtn').onclick = () => document.body.classList.toggle('menu');
$('scrim').onclick = () => document.body.classList.remove('menu');

function setTheme(th){
  document.documentElement.setAttribute('data-theme', th);
  $('themeBtn').textContent = th === 'dark' ? '☀️' : '🌙';
  try{ localStorage.setItem('theme', th); }catch(e){}
}
let saved = null; try{ saved = localStorage.getItem('theme'); }catch(e){}
setTheme(saved || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('themeBtn').onclick = () => setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');

$('stats').innerHTML = [
  [T.length,'Tổng mục'],
  [T.filter(t=>groupOf(t[1])==='HTML').length,'Thẻ HTML'],
  [T.filter(t=>groupOf(t[1])==='CSS').length,'Lệnh CSS'],
  [T.filter(t=>groupOf(t[1])==='JavaScript').length,'Lệnh JS']
].map(([n,l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');

buildSide(); render();
</script>
</body>
</html>
